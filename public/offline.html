<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ae4625">
  <title>Sedang offline — FieldObserver</title>
  <style>
    :root { color-scheme: light; --bg:#fffaf3; --text:#35251f; --muted:#796052; --panel:#fffdf9; --border:#eadbce; }
    :root[data-theme="dark"] { color-scheme:dark; --bg:#241914; --text:#fffaf3; --muted:#dbc2b1; --panel:#35251f; --border:#5b4033; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; padding:24px; } main { width:100%; max-width:440px; padding:36px; background:var(--panel); border:1px solid var(--border); border-radius:16px; } img { width:56px; height:56px; border-radius:12px; } h1 { font-size:26px; margin:24px 0 12px; } p { color:var(--muted); line-height:1.8; font-size:14px; } a { display:inline-block; margin-top:12px; background:#ae4625; color:#fffaf3; padding:13px 20px; border-radius:8px; text-decoration:none; font-size:14px; } a:focus-visible { outline:3px solid var(--text); outline-offset:4px; }
  </style>
  <script>try{var t=localStorage.getItem('fieldobserver-theme');document.documentElement.dataset.theme=t==='light'||t==='dark'?t:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}catch(e){document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}</script>
</head>
<body><main><img src="/android-chrome-192x192.png" alt="" width="56" height="56"><h1>Koneksi sedang terputus.</h1><p>FieldObserver memerlukan internet untuk membuka formulir dan menyimpan observasi. Sambungkan kembali perangkatmu, lalu coba lagi.</p><a href="/">Coba lagi</a></main></body>
</html>
